# ------------------------------------------------------------------------------------
#  Docker Release (Multi-Architecture)
#
#  Purpose: Build multi-architecture Docker images and push to GitHub Container Registry
#  Architectures: linux/amd64, linux/arm64, linux/arm/v7
#  Maintainer: @mrz1836
#
# ------------------------------------------------------------------------------------

name: Docker Release

# --------------------------------------------------------------------
# Trigger Configuration
# --------------------------------------------------------------------
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (leave empty for latest only)'
        required: false
        type: string

# Security: Restrictive default permissions with job-level overrides for least privilege access
permissions: {}

# --------------------------------------------------------------------
# Concurrency Control
# --------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------------
  # Build Binaries for Each Architecture
  # ----------------------------------------------------------------------------------
  build-binaries:
    name: Build Binary (${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cc: gcc
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - goos: linux
            goarch: arm
            cc: arm-linux-gnueabihf-gcc
    steps:
      # --------------------------------------------------------------------
      # Checkout code
      # --------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --------------------------------------------------------------------
      # Set up Go
      # --------------------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # --------------------------------------------------------------------
      # Install cross-compilers for ARM architectures
      # --------------------------------------------------------------------
      - name: Install cross-compiler
        if: matrix.goarch != 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      # --------------------------------------------------------------------
      # Build binary with CGO for the target architecture
      # --------------------------------------------------------------------
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '7' || '' }}
          CC: ${{ matrix.cc }}
          CGO_ENABLED: 1
        run: |
          mkdir -p dist/${{ matrix.goos }}/${{ matrix.goarch }}
          go build -o dist/${{ matrix.goos }}/${{ matrix.goarch }}/block-headers-service ./cmd/

      # --------------------------------------------------------------------
      # Upload binary as artifact
      # --------------------------------------------------------------------
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 1

  # ----------------------------------------------------------------------------------
  # Build and Push Multi-Architecture Docker Image
  # ----------------------------------------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: build-binaries
    permissions:
      contents: read
      packages: write
    steps:
      # --------------------------------------------------------------------
      # Checkout code
      # --------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --------------------------------------------------------------------
      # Download all binary artifacts
      # --------------------------------------------------------------------
      - name: Download all binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      # --------------------------------------------------------------------
      # Prepare dist structure for release Dockerfile
      # --------------------------------------------------------------------
      - name: Prepare dist structure
        run: |
          # release/Dockerfile expects: ./dist/$TARGETPLATFORM/block-headers-service
          # TARGETPLATFORM format: linux/amd64, linux/arm64, linux/arm/v7
          # Artifacts are downloaded as: dist/linux/{amd64,arm64,arm}/block-headers-service

          # Create arm/v7 directory and move arm binary there (Docker uses arm/v7, Go uses arm)
          mkdir -p dist/linux/arm/v7
          mv dist/linux/arm/block-headers-service dist/linux/arm/v7/

          # Make all binaries executable
          chmod +x dist/linux/amd64/block-headers-service
          chmod +x dist/linux/arm64/block-headers-service
          chmod +x dist/linux/arm/v7/block-headers-service

          # Debug: show structure
          echo "Dist structure:"
          find dist -type f -name "block-headers-service"

      # --------------------------------------------------------------------
      # Set up QEMU for multi-architecture builds
      # --------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      # --------------------------------------------------------------------
      # Set up Docker Buildx
      # --------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # --------------------------------------------------------------------
      # Generate Docker metadata (tags and labels)
      # --------------------------------------------------------------------
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # --------------------------------------------------------------------
      # Log in to GHCR
      # --------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------
      # Build and push multi-architecture Docker image
      # --------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: release/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            project_name=block-headers-service
            repository_owner=bsv-blockchain
